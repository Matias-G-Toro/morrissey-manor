# Media configuration for your images folder
media:
  name: images
  label: Images
  input: images
  output: /images
  extensions: [png, jpg, jpeg, webp, svg]

# Content configuration for managing your index.html page
content:
  - name: homepage
    label: Home Page
    type: file
    path: index.html
    format: raw
    fields:
      - name: body
        label: HTML Content
        type: rich-text
